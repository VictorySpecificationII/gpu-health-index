global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

scrape_configs:
  - job_name: gpu-health
    # Use scheme: https when the exporter is built with WITH_TLS=1.
    # Change to http for plain-HTTP deployments.
    scheme: https
    tls_config:
      insecure_skip_verify: true   # self-signed cert on GPU nodes
    file_sd_configs:
      - files: ['/var/run/gpu-health/file_sd.json']
        refresh_interval: 30s
