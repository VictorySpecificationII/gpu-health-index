global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

scrape_configs:
  - job_name: gpu-health
    file_sd_configs:
      - files: ['/var/run/gpu-health/file_sd.json']
        refresh_interval: 30s
