services:
  prometheus:
    image: prom/prometheus:latest
    container_name: gpu-health-prometheus
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
      - /var/run/gpu-health:/var/run/gpu-health:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: gpu-health-alertmanager
    network_mode: host
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: gpu-health-grafana
    network_mode: host
    environment:
      - GF_SERVER_HTTP_PORT=3000
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  # LocalStack — local S3-compatible store for development and integration testing.
  # Exposes S3 on port 4566. Not needed in production — remove or comment out
  # when deploying against a real S3 endpoint.
  #
  # Create the probe-history bucket after first start:
  #   aws --endpoint-url http://localhost:4566 s3 mb s3://gpu-health-probe-history
  localstack:
    image: localstack/localstack:latest
    container_name: gpu-health-localstack
    network_mode: host
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - LOCALSTACK_HOST=localhost
    volumes:
      - localstack-data:/var/lib/localstack
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  localstack-data:
