global:
  resolve_timeout: 5m
  # Receiver-specific globals (SMTP, Slack API URL, etc.) go here when configured.

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s        # wait before sending first notification for a new group
  group_interval: 5m     # wait before sending new notifications for an existing group
  repeat_interval: 4h    # resend if alert is still firing after this duration
  receiver: default

receivers:
  - name: default
    # TODO: configure a receiver for your environment.
    # Uncomment and fill in exactly one of the blocks below.

