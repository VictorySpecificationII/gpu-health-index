    # ---- Generic webhook -----------------------------------------------------
    # webhook_configs:
    #   - url: 'http://your-webhook-endpoint/alerts'
    #     send_resolved: true

inhibit_rules:
  # Suppress warning-severity alerts when a critical alert is already firing
  # for the same GPU (matched on instance + serial).  Avoids double-paging
  # when e.g. GpuDecommissionCandidate (critical) and GpuDegrading (warning)
  # fire together for the same device.
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [instance, serial]
